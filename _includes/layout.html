<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} - SanJuaneando</title>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Menú Superior -->
  <nav class="bg-blue-800 text-white p-4 shadow-md">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <a href="/" class="text-2xl font-bold hover:text-blue-200">SanJuaneando</a>
      <a href="/admin/" class="text-sm bg-blue-600 px-3 py-1 rounded hover:bg-blue-500">Panel de Noticias</a>
    </div>
  </nav>

  <!-- Contenedor del Artículo -->
  <main class="max-w-3xl mx-auto p-6 mt-8 bg-white shadow-lg rounded-lg mb-12">
    <h1 class="text-4xl font-bold text-blue-900 mb-4">{{ title }}</h1>
    
    <div class="text-gray-500 mb-6 font-semibold flex gap-4">
      <span>Publicado: {{ date | date: "%d/%m/%Y" }}</span>
      {% if lugar %}<span>📍 {{ lugar }}</span>{% endif %}
    </div>

    {% if thumbnail %}
      <img src="{{ thumbnail }}" alt="Imagen de {{ title }}" class="w-full h-auto rounded-lg mb-8 shadow-sm">
    {% endif %}

    <!-- Aquí se inyecta el texto que escribes en el panel -->
    <article class="prose prose-blue lg:prose-lg max-w-none">
      {{ content }}
    </article>
  </main>

</body>
</html>
